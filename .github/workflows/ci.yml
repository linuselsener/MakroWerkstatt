name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: MakroWerkstatt.sln

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\MakroWerkstatt.sln

      - name: Build solution
        run: dotnet build .\MakroWerkstatt.sln -c Release --no-restore -warnaserror

      - name: Run xUnit tests
        run: dotnet test .\MakroWerkstatt.sln -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Run console smoke test
        run: dotnet run --project .\tools\SmokeTests\SmokeTests.csproj -c Release --no-build --no-restore

      # verify-ui.ps1 needs an interactive desktop session; publish-windows.ps1 changes the local desktop installation.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xunit-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  published-zip-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build and launch published ZIP without a .NET installation
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\smoke-published-zip.ps1
