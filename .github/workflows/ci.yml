name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            MakroWerkstatt.csproj
            tests/MakroWerkstatt.Tests/MakroWerkstatt.Tests.csproj
            tools/SmokeTests/SmokeTests.csproj

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\tests\MakroWerkstatt.Tests\MakroWerkstatt.Tests.csproj
          dotnet restore .\tools\SmokeTests\SmokeTests.csproj

      - name: Build app
        run: dotnet build .\MakroWerkstatt.csproj -c Release --no-restore -warnaserror

      - name: Build tests
        run: dotnet build .\tests\MakroWerkstatt.Tests\MakroWerkstatt.Tests.csproj -c Release --no-restore -warnaserror

      - name: Build smoke test
        run: dotnet build .\tools\SmokeTests\SmokeTests.csproj -c Release --no-restore -warnaserror

      - name: Run xUnit tests
        run: dotnet test .\tests\MakroWerkstatt.Tests\MakroWerkstatt.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Run console smoke test
        run: dotnet run --project .\tools\SmokeTests\SmokeTests.csproj -c Release --no-build --no-restore

      # verify-ui.ps1 needs an interactive desktop session; publish-windows.ps1 changes the local desktop installation.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xunit-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
