name: Release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: MakroWerkstatt.sln

      - name: Prüfe Tag gegen Projektversion
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath .\MakroWerkstatt.csproj -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) { throw 'In MakroWerkstatt.csproj fehlt die Projektversion.' }
          $projectVersion = $versionNode.InnerText.Trim()
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v', [StringComparison]::Ordinal)) { throw "Ungültiger Release-Tag: $tag" }
          $tagVersion = $tag.Substring(1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Der Tag muss vX.Y.Z entsprechen: $tag" }
          if ($tagVersion -cne $projectVersion) {
            throw "Tag-Version $tagVersion stimmt nicht mit Projektversion $projectVersion überein."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$tagVersion"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\MakroWerkstatt.sln

      - name: Build solution
        run: dotnet build .\MakroWerkstatt.sln -c Release --no-restore -warnaserror

      - name: Run xUnit tests
        run: dotnet test .\MakroWerkstatt.sln -c Release --no-build --no-restore

      - name: Run console smoke test
        run: dotnet run --project .\tools\SmokeTests\SmokeTests.csproj -c Release --no-build --no-restore

      - name: Publish ZIP und Prüfsummen
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\publish-windows.ps1 -NoShortcut

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: MakroWerkstatt-${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/MakroWerkstatt-${{ steps.version.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  create-draft:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: MakroWerkstatt-${{ needs.package.outputs.version }}-win-x64
          path: dist

      - name: Extract release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $changelog = Get-Content -LiteralPath .\CHANGELOG.md -Raw
          $versionPattern = [regex]::Escape($env:RELEASE_VERSION)
          $pattern = "(?ms)^## \[$versionPattern\][^\r\n]*\r?\n(?<notes>.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success -and -not [string]::IsNullOrWhiteSpace($match.Groups['notes'].Value)) {
            $notes = $match.Groups['notes'].Value.Trim()
          } else {
            $notes = "Für Version $($env:RELEASE_VERSION) wurde kein passender Abschnitt in CHANGELOG.md gefunden."
          }
          Set-Content -LiteralPath .\release-notes.md -Value $notes -Encoding utf8

      - name: Create GitHub release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "MakroWerkstatt $($env:RELEASE_VERSION)"
          $zip = Join-Path .\dist "MakroWerkstatt-$($env:RELEASE_VERSION)-win-x64.zip"
          $checksums = Join-Path .\dist 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Release-ZIP fehlt: $zip" }
          if (-not (Test-Path -LiteralPath $checksums)) { throw "SHA256SUMS.txt fehlt: $checksums" }
          gh release create $tag $zip $checksums --draft --title $title --notes-file .\release-notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create wurde mit Code $LASTEXITCODE beendet." }
