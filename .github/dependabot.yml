version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    directories:
      - /
      - /tests/MakroWerkstatt.Tests
      - /tools/SmokeTests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
